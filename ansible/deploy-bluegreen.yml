---
- hosts: "{{ target_env }}"
  become: yes

  tasks:

    - name: Install git
      apt:
        name: git
        state: present
        update_cache: yes

    - name: Install nodejs
      apt:
        name: nodejs
        state: present

    - name: Install npm
      apt:
        name: npm
        state: present

    - name: Install nginx
      apt:
        name: nginx
        state: present

    - name: Remove old app
      file:
        path: /opt/banking-app
        state: absent

    - name: Clone repo
      git:
        repo: https://github.com/hack3rinsider/Banking-App.git
        dest: /opt/banking-app
        force: yes

    - name: Install dependencies
      shell: |
        cd /opt/banking-app/backend
        npm install

    - name: Install PM2
      npm:
        name: pm2
        global: yes

    - name: Set BLUE version
      replace:
        path: /opt/banking-app/backend/server.js
        regexp: "res.send\\(process.env.HOSTNAME \\|\\| 'unknown'\\);"
        replace: "res.send('BLUE');"
      when: target_env == "blue"

    - name: Set GREEN version
      replace:
        path: /opt/banking-app/backend/server.js
        regexp: "res.send\\(process.env.HOSTNAME \\|\\| 'unknown'\\);"
        replace: "res.send('GREEN');"
      when: target_env == "green"

    - name: Restart backend
      shell: |
        cd /opt/banking-app/backend
        pm2 delete banking-api || true
        pm2 start server.js --name banking-api

    - name: Deploy frontend
      shell: |
        rm -rf /var/www/html/*
        cp -r /opt/banking-app/frontend/* /var/www/html/

    - name: Restart nginx
      shell: nginx -s reload || true
